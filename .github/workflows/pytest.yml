name: Pytest

# One job on purpose. Unit and integration used to be separate jobs with
# `needs: test`, so every green run paid for two runners, two Redis
# containers, two Mongo replica sets, and two .venv caches (different keys).
# Integration is ~10s of admin-interface tests; the second job's setup was
# ~2.5x longer than the tests. Markers stay for a faster local loop:
#   uv run pytest -m "not integration and not live_nectar"
on:
  push:
    branches:
      - main
      - develop
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - develop
    paths-ignore:
      - "**.md"
      - ".gitignore"
      - "LICENSE"
      - ".env*"

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      HIVE_ACC_TEST: ${{ secrets.HIVE_ACC_TEST }}
      HIVE_MEMO_TEST_KEY: ${{ secrets.HIVE_MEMO_TEST_KEY }}
      # Live Hive/Nectar stability probes are local-only (network + long runtime).
      NECTAR_STABILITY: "0"
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}
    services:
      redis:
        image: redis:latest
        ports:
          - "6379:6379"

    steps:
      - uses: actions/checkout@v6

      # Official uv action: installs uv, sets Python 3.12, caches the uv store
      # (~/.cache/uv). That cache rebuilds a venv cheaply; caching .venv itself
      # is brittle across Python patch bumps.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Start MongoDB
        uses: supercharge/mongodb-github-action@1.12.1
        with:
          mongodb-version: "8.0"
          mongodb-replica-set: rsPytest
          mongodb-port: 37017

      # Fail-fast: unit first, then the small integration suite on the same
      # runner / venv / Redis / Mongo. No second job.
      - name: Run unit/fast tests
        run: |
          uv run pytest -m "not integration and not live_nectar" \
            --ignore=tests/hive/test_nectar_long_running_stability.py \
            --durations=20

      - name: Run integration tests
        run: |
          uv run pytest -m "integration and not live_nectar" \
            --ignore=tests/hive/test_nectar_long_running_stability.py \
            --durations=20

      - name: Print service container logs
        if: failure()
        run: |
          echo "MongoDB logs:"
          docker logs $(docker ps -q --filter "ancestor=mongo:8.0")
          echo "Redis logs:"
          docker logs $(docker ps -q --filter "ancestor=redis:latest")
